name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Stdlib-only, no simulator and no venv: placed before the toolchain
      # installs so a gating regression fails in seconds, not after setup.
      - name: Runner CLI gating self-test
        run: python3 verification/selftest_run_tests.py

      - name: Path-gate base-selection self-test
        # Drives scripts/loom-path-gate-base.sh over every event shape the
        # path gate below can see (pull_request, push, merge_group, and the
        # fail-closed cases) before any toolchain is installed.
        run: sh scripts/selftest_loom_path_gate.sh

      - name: Install simulation and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator
          # A missing tool must fail the job, never skip a step.
          for t in iverilog verilator; do command -v "$t"; done

      - name: Install Python deps
        run: |
          python3 -m pip install --user uv
          uv venv .venv
          uv pip install --python .venv/bin/python -r verification/requirements.txt

      - name: RTL lint
        run: scripts/lint-rtl.sh

      - name: Smoke test and negative control
        run: .venv/bin/python verification/run_tests.py

      - name: Validate result record
        run: .venv/bin/python verification/check_records.py

      - name: Validate committed gate-level record
        # The no-arg step above validates only the freshly generated RTL
        # records (sim/build/verification/*.json). The committed gate-level
        # evidence pair is an artifact too: this runs the validator on it
        # explicitly, so a regenerated netlist that orphans the record --
        # including the committed record naming a netlist that no longer
        # exists, which main once carried silently (#92) -- fails CI here.
        run: .venv/bin/python verification/check_records.py verification/gate-level/records/result-gate.json

      - name: Record-schema unit tests
        run: .venv/bin/python -m unittest discover -s verification -p 'test_record_schema.py'

      - name: Upload result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-result
          # One record per suite in SUITES, as run_tests.py writes them; the
          # same top-level *.json glob check_records.py validates.
          path: sim/build/verification/*.json
          # A run that captured no record is not an empty artifact, it is a
          # missing one: fail instead of warning.
          if-no-files-found: error

  # CI for the vendored Loom tooling this repo carries under .loom/.
  # A resync PR (#123-style) currently gets a green badge from the design
  # verification flow alone, which never exercises .loom/scripts/**; this
  # job closes that gap (issue #124) with a narrow, hand-verified allowlist
  # rather than running run-ci-suites.sh wholesale (untested cost and
  # portability in a client repo, and a shared-runner budget to respect).
  loom-tooling:
    runs-on: ubuntu-24.04
    # The job only runs local test scripts and reads the checkout; the
    # GITHUB_TOKEN needs nothing beyond read, so grant exactly that
    # (CodeQL actions/job-or-workflow-missing-permissions).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The path gate diffs the event's base sha against HEAD; the base
          # can be arbitrarily far below HEAD, so a shallow clone cannot.
          fetch-depth: 0

      # Path gate, deliberately NOT workflow-level `on.paths`: a path-
      # filtered event never schedules the job at all, so a required check
      # would stay pending forever. Gating inside the job instead means a
      # design-only PR skips the suite steps but the job itself still
      # reports success (.loom/docs/ci-principles.md: path filtering is an
      # optimisation, and a check that cannot run must never look like a
      # pass).
      - name: Detect changed vendored Loom tooling paths
        id: paths
        # Event context enters as step env, never as ${{ }} inside the
        # script, so the base selection is testable:
        # scripts/selftest_loom_path_gate.sh drives it for pull_request,
        # push, and merge_group (the trial-merge checkout's base, issue
        # #131) plus the fail-closed cases.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          BASE="$(sh scripts/loom-path-gate-base.sh)"
          if [[ -n "$(git diff --name-only "$BASE" HEAD -- .loom/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Allowlist rationale. All suites are black-box unit tests that stub
      # `gh` on PATH and need only bash/jq/git from a stock runner; each was
      # verified green by hand against THIS repo's vendored copy (issue
      # #124: 86/86, 81/81, 165/165 lease suites; issue #126: the merge-pr
      # and spawn-claude suites below, each run one process at a time from a
      # clean checkout), which is the actual gap -- upstream CI tests the
      # loom source tree, not what got vendored here.
      #
      # The added suites name-map to the executable scripts that actually
      # churn in resync PRs (measured on #119/#123: merge-pr.sh,
      # spawn-claude.sh, spawn-codex.sh); only suites already wired in
      # upstream's ci-wired.txt were candidates, and only ones that pass
      # here were added. Every other merge-pr/spawn-claude sibling suite is
      # excluded upstream for needing a built loom-daemon binary, which this
      # repo's CI deliberately does not build.
      #
      # Deliberately NOT covered (issue #126): the spawn-codex.sh family --
      # every vendored suite exercising its daemon-dispatch behaviour
      # (test-spawn-codex*.sh) requires a built loom-daemon, so no wired
      # suite covers that script in a client repo. A resync diff touching
      # spawn-codex.sh gets a green job that ran nothing over it.
      #
      # Why the two other `.loom/`-adjacent suites are NOT allowlisted:
      #   - test-targeted-role-invocation.sh is "wired" upstream, but it
      #     resolves paths under $REPO_ROOT/defaults/, which exists only in
      #     the loom source repo -- a client repo's vendored .loom/ copy has
      #     no defaults/, so the suite fails here regardless of code health.
      #   - test-spawn-codex-session-exec.sh is excluded upstream for the
      #     same reason this repo must honor: it needs a built loom-daemon
      #     binary, and building one in this repo's CI is out of budget.
      #
      # The `env -u` unsets make the suites' environment deterministic: a
      # self-hosted or reused runner that inherited Loom dispatch variables
      # (LOOM_FORCE_SCOPE in particular changes guard-hook behavior) must
      # not influence these results, and this matches how the suites were
      # verified green by hand.
      - name: sweep-lease-fence suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-sweep-lease-fence.sh

      - name: sweep-lease-publish suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-sweep-lease-publish.sh

      - name: sweep-lease-renew suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-sweep-lease-renew.sh

      # Issue #126: wired merge-pr suites covering the merge-pr.sh churn that
      # resync PRs (#119) actually carry. All verified green here by hand.
      - name: merge-pr app-permission-fallback suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-app-permission-fallback.sh

      - name: merge-pr daemon-version-floor suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-daemon-version-floor.sh

      - name: merge-pr expected-head suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-expected-head.sh

      - name: merge-pr pr-state suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-pr-state.sh

      - name: merge-pr required-checks suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-required-checks.sh

      - name: merge-pr stacked-child-branch-delete suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-stacked-child-branch-delete.sh

      - name: merge-pr tree-checks suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-merge-pr-tree-checks.sh

      # Issue #126: wired spawn-claude suites covering the spawn-claude.sh
      # churn that resync PRs carry. All verified green here by hand.
      - name: spawn-claude container-gh suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-spawn-claude-container-gh.sh

      - name: spawn-claude memory-max suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-spawn-claude-memory-max.sh

      - name: spawn-claude oom-policy suite
        if: steps.paths.outputs.changed == 'true'
        run: env -u LOOM_ROLE -u LOOM_FORCE_SCOPE -u LOOM_GUARD_DECISION_LOG bash .loom/scripts/tests/test-spawn-claude-oom-policy.sh
